name: Repo lockdown keeper

# Guardián del blindaje del repo.
# GitHub disena los "interaction limits" para expirar por defecto (max 1 mes via API),
# asi que este workflow renueva el limite `collaborators_only` cada 6 horas para que
# outsiders nunca puedan abrir PRs, issues ni comentarios en el repo.
#
# Enlaces de referencia:
# - Branch protection de `main` (sin force push, sin borrado, incluye admins) es
#   persistente y se gestiona directo en GitHub: Settings > Branches > Branch protection.
# - Este workflow SOLO corre en el repo original. En forks se apaga (guard de abajo),
#   asi que usar Brand-OS como plantilla no hereda tareas que fallen.

on:
  schedule:
    - cron: "21 */6 * * *" # cada 6 horas (renewal margin: expiracion es 24 h)
  workflow_dispatch:

permissions:
  administration: write

jobs:
  renew-interaction-limits:
    if: github.repository == 'Mgomezpo/Brand-OS'
    runs-on: ubuntu-latest
    steps:
      - name: Renovar interaction limit -> solo colaboradores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT repos/"$GITHUB_REPOSITORY"/interaction-limits \
            -f limit=collaborators_only -f expiry=one_day
          gh api repos/"$GITHUB_REPOSITORY"/interaction-limits \
            --jq '{limit: .limit, expires_at: .expires_at}'

  assert-branch-protection:
    if: github.repository == 'Mgomezpo/Brand-OS'
    runs-on: ubuntu-latest
    needs: renew-interaction-limits
    steps:
      - name: Verificar que main sigue blindada (sin force push, sin borrado)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh api repos/"$GITHUB_REPOSITORY"/branches/main/protection \
            --jq '{enforce_admins: .enforce_admins.enabled, allow_force_pushes: .allow_force_pushes.enabled, allow_deletions: .allow_deletions.enabled}')"
          echo "main protection: $state"
          if [ "$(echo "$state" | grep -c '"allow_force_pushes":false')" -ne 1 ] || \
             [ "$(echo "$state" | grep -c '"allow_deletions":false')" -ne 1 ] || \
             [ "$(echo "$state" | grep -c '"enforce_admins":true')" -ne 1 ]; then
            echo "::error::La proteccion de main cambio! Restaurala en Settings > Branches."
            exit 1
          fi
