name: Repo lockdown (manual)

# Boton MANUAL de respaldo para renovar el blindaje del repo.
# Disparo: gh workflow run interactions-keeper.yml --repo Mgomezpo/Brand-OS
# (o web UI > Actions > Repo lockdown (manual) > Run workflow).
#
# Importante: el GITHUB_TOKEN de Actions NO tiene permiso 'administration'
# sobre la API de configuracion del repositorio, por eso este workflow NO
# usa horario automatico. Sin el secret GH_ADMIN_TOKEN este job no toca
# nada (solo avisa). El renovador oficial y automatico es la tarea
# programada local de Windows 'BrandOS-Renovar-Interacciones-GitHub',
# que ejecuta gh CLI con el token del keyring del owner.
#
# Si el owner quiera delegar la renovacion a GitHub (opcional): crear un
# PAT fino (fine-grained) de Mgomezpo con permiso Administration: write
# restringido SOLO a este repo y guardarlo como secret GH_ADMIN_TOKEN.

on:
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Renovar interaction limit y verificar proteccion de main
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Sin secret GH_ADMIN_TOKEN no se renueva nada desde Aqui. Uso: schtasks /Run /TN BrandOS-Renovar-Interacciones-GitHub (local, fuente de verdad)."
            exit 0
          fi
          gh api --method PUT repos/Mgomezpo/Brand-OS/interaction-limits \
            --field limit=collaborators_only --field expiry=one_month \
            --jq '{limit: .limit, expires_at: .expires_at}'
          state="$(gh api repos/Mgomezpo/Brand-OS/branches/main/protection \
            --jq '{enforce_admins: .enforce_admins.enabled, allow_force_pushes: .allow_force_pushes.enabled, allow_deletions: .allow_deletions.enabled}')"
          echo "Proteccion de main: $state"
          if [ "$(echo "$state" | grep -c '"allow_force_pushes":false')" -ne 1 ] || \
             [ "$(echo "$state" | grep -c '"allow_deletions":false')" -ne 1 ] || \
             [ "$(echo "$state" | grep -c '"enforce_admins":true')" -ne 1 ]; then
            echo "::error::La proteccion de main se perdio. Restaurar en Settings > Branches."
            exit 1
          fi
